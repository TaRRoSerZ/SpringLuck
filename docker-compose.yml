services:
  database:
    image: postgres:17
    container_name: springluck_db
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: springluck
      POSTGRES_USER: springluck_user
      POSTGRES_DB: springluckDB
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.4
    container_name: springluck_keycloak
    command: start-dev
    ports:
      - 9090:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/springluckDB
      KC_DB_USERNAME: springluck_user
      KC_DB_PASSWORD: springluck
      KC_DB_SCHEMA: keycloak
    depends_on:
      - database

  stripe-cli:
    image: stripe/stripe-cli:v1.33.2
    container_name: springluck_stripe-cli
    command: listen --api-key ${STRIPE_API_KEY} --forward-to http://host.docker.internal:8083/stripe/webhook

volumes:
  db_data: